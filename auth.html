<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Crave</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <span class="logo-text">Crave</span>
                </div>
                <h1 id="authTitle">Welcome Back</h1>
                <p id="authSubtitle">Sign in to continue your food journey</p>
            </div>

            <!-- Sign In Form -->
            <form class="auth-form" id="signinForm">
                <div class="form-group">
                    <label for="signinEmail">Email Address</label>
                    <input type="email" id="signinEmail" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="signinPassword">Password</label>
                    <div class="password-input">
                        <input type="password" id="signinPassword" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" data-target="signinPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn-primary auth-btn">
                    <span class="btn-text">Sign In</span>
                    <div class="btn-loader"></div>
                </button>
            </form>

            <!-- Sign Up Form (Hidden by default) -->
            <form class="auth-form hidden" id="signupForm">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <div class="password-input">
                        <input type="password" id="signupPassword" placeholder="Create a password" required>
                        <button type="button" class="toggle-password" data-target="signupPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-input">
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                        <button type="button" class="toggle-password" data-target="confirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="profileImage">Profile Image (Optional)</label>
                    <div class="file-input-container">
                        <input type="file" id="profileImage" accept="image/*" class="file-input">
                        <label for="profileImage" class="file-input-label">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>Choose Image</span>
                        </label>
                        <div class="image-preview" id="imagePreview"></div>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="agreeTerms" required>
                        <span class="checkmark"></span>
                        I agree to the <a href="#">Terms & Conditions</a>
                    </label>
                </div>
                
                <button type="submit" class="btn-primary auth-btn">
                    <span class="btn-text">Create Account</span>
                    <div class="btn-loader"></div>
                </button>
            </form>

            <div class="auth-switch">
                <p id="switchText">Don't have an account? <a href="#" id="switchLink">Sign up</a></p>
            </div>

            <div class="divider">
                <span>or</span>
            </div>

            <div class="social-auth">
                <button class="social-btn google-btn" id="googleSignin">
                    <i class="fab fa-google"></i>
                    Continue with Google
                </button>
            </div>
        </div>

        <div class="auth-image">
            <img src="images/12.png" alt="">
            <div class="image-overlay">
                <h2>Discover Amazing Food</h2>
                <p>Join thousands of food lovers and discover your next favorite meal</p>
            </div>
        </div>
    </div>

    <!-- Alert Messages -->
    <div class="alert-container" id="alertContainer"></div>

    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
